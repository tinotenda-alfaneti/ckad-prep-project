apiVersion: v1
kind: Pod
metadata:
  name: broken-image
  namespace: dev
spec:
  containers:
  - name: app
    image: nginx:nonexistent-tag
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "128Mi"
        cpu: "200m"
---
apiVersion: v1
kind: Pod
metadata:
  name: crash-loop
  namespace: dev
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ['sh', '-c', 'exit 1']
    resources:
      requests:
        memory: "32Mi"
        cpu: "50m"
      limits:
        memory: "64Mi"
        cpu: "100m"
---
apiVersion: v1
kind: Pod
metadata:
  name: missing-cm
  namespace: dev
spec:
  containers:
  - name: app
    image: nginx
    envFrom:
    - configMapRef:
        name: does-not-exist
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "128Mi"
        cpu: "200m"
